# Checks the code on every push and pull request to main.
#   csv-helper: installs dependencies, checks index.js, runs the unit tests (Node 20 and 22)
#   scripts:    checks every shell script for syntax errors
#   secrets:    fails if a key, secret, real project ID or real email address is committed

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  csv-helper:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: csv-helper

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: csv-helper/package-lock.json
    - run: npm ci
    - name: Check index.js for syntax errors
      run: node --check index.js
    - name: Run unit tests
      run: npm test

  shell-scripts:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check shell scripts for syntax errors
      run: |
        for f in $(git ls-files '*.sh'); do
          echo "Checking $f"
          bash -n "$f"
        done

  secrets:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check for keys, secrets and real email addresses
      run: bash scripts/check-secrets.sh
