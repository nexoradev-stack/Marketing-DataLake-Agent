<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Marketing DataLake Agent</title>
  <desc id="d">From an event name to a clean prospect list. Vendor tables flow into one data lake; the agent filters out unmailable and repeat contacts and delivers a CSV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182a"/>
      <stop offset="1" stop-color="#0c3a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.9"/>
    </linearGradient>
    <g id="db">
      <path d="M-26 -14 v28 a26 9 0 0 0 52 0 v-28" fill="#12324a" stroke="#7dd3fc" stroke-width="2.5"/>
      <ellipse cx="0" cy="-14" rx="26" ry="9" fill="#1b4a6b" stroke="#7dd3fc" stroke-width="2.5"/>
      <path d="M-26 0 a26 9 0 0 0 52 0" fill="none" stroke="#7dd3fc" stroke-width="1.6" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <!-- Title -->
  <g font-family="Lexend, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#7dd3fc" font-size="26" font-weight="500">Marketing</text>
    <text x="70" y="182" fill="#ffffff" font-size="64" font-weight="700" textLength="292" lengthAdjust="spacingAndGlyphs">DataLake</text>
    <text x="378" y="182" fill="#22d3ee" font-size="64" font-weight="700" textLength="168" lengthAdjust="spacingAndGlyphs">Agent</text>
    <text x="72" y="228" fill="#c7dbe6" font-size="23" font-weight="400">From an event name to a clean prospect list.</text>

    <g font-size="15" font-weight="500">
      <rect x="72" y="258" width="158" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="151" y="279" fill="#cdeefe" text-anchor="middle">Gemini Enterprise</text>
      <rect x="240" y="258" width="96" height="32" rx="16" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="288" y="279" fill="#dde0ff" text-anchor="middle">BigQuery</text>
      <rect x="346" y="258" width="112" height="32" rx="16" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="402" y="279" fill="#c8f5e3" text-anchor="middle">No repeats</text>
      <rect x="468" y="258" width="168" height="32" rx="16" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.6"/>
      <text x="552" y="279" fill="#ffd6d6" text-anchor="middle">Unmailable blocked</text>
    </g>
  </g>

  <!-- Vendor tables -->
  <use href="#db" transform="translate(760 92)"/>
  <use href="#db" transform="translate(836 72)"/>
  <use href="#db" transform="translate(912 92)"/>
  <g stroke="#7dd3fc" stroke-width="2" stroke-dasharray="5 6" fill="none" opacity="0.7">
    <path d="M760 118 C 770 160, 800 175, 830 200"/>
    <path d="M836 98 L 836 196"/>
    <path d="M912 118 C 902 160, 872 175, 842 200"/>
  </g>

  <!-- Lake -->
  <ellipse cx="836" cy="240" rx="150" ry="44" fill="url(#lake)"/>
  <ellipse cx="836" cy="232" rx="150" ry="36" fill="none" stroke="#a5f3fc" stroke-opacity="0.5" stroke-width="2"/>
  <g stroke="#e0fbff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M748 236 q 14 -8 28 0 t 28 0"/>
    <path d="M842 250 q 14 -8 28 0 t 28 0"/>
    <path d="M806 222 q 12 -7 24 0 t 24 0"/>
  </g>

  <!-- Filter / agent -->
  <path d="M990 240 H 1048" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="5 6"/>
  <circle cx="1080" cy="240" r="30" fill="#0b2a3f" stroke="#22d3ee" stroke-width="3"/>
  <path d="M1080 222 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z" fill="#22d3ee"/>
  <!-- blocked contact drops out -->
  <path d="M1080 270 C 1080 292, 1072 305, 1062 318" stroke="#f87171" stroke-width="2.4" stroke-dasharray="4 5" fill="none"/>
  <circle cx="1058" cy="322" r="9" fill="#f87171"/>
  <path d="M1053 317 l10 10 M1063 317 l-10 10" stroke="#07182a" stroke-width="2.4" stroke-linecap="round"/>

  <!-- CSV -->
  <path d="M1110 240 H 1150" stroke="#34d399" stroke-width="2.5"/>
  <g transform="translate(1152 196)">
    <path d="M0 0 h44 l18 18 v70 h-62 z" fill="#0f3a2e" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M44 0 v18 h18" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#6ee7b7" stroke-width="2" stroke-linecap="round">
      <path d="M10 34 h40"/><path d="M10 46 h40"/><path d="M10 58 h40"/><path d="M10 70 h28"/>
    </g>
    <text x="31" y="108" fill="#a7f3d0" font-family="Lexend, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CSV</text>
  </g>
</svg>
